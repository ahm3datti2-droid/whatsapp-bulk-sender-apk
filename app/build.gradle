plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ahmedattia.whatsappbulk'
    compileSdk 34

    defaultConfig {
        applicationId "com.ahmedattia.whatsappbulk"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// Fix checkDebugDuplicateClasses: AppCompat/AGP pull conflicting
// Kotlin stdlib versions (1.8.22 vs 1.6.21 jdk7/jdk8 vs 1.9.24).
// Force one stdlib version and drop the old jdk7/jdk8 split jars,
// whose classes are already inside kotlin-stdlib 1.9.24.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.9.24'
            details.because 'Single Kotlin stdlib version to avoid duplicate classes'
        }
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
